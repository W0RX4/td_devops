name: pages deploy

on: 
    push: 
        branches: [ "master" ]

jobs:
    build: 
        runs-on: ubuntu-latest
        steps:
            - name: Checkout deploy
              uses: actions/checkout@v4

            - name: Configure pages
              uses: actions/configure-pages@v5

            - name: Upload pages
              uses: actions/upload-pages-artifact@v3
              with: 
                path: '.'
    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment: 
            name: github-pages
        steps:
            - name: Deploy
              uses: actions/deploy-pages@v5
        


permissions: 
    contents: read
    pages: write
    id-token: write