name: pages deploy

on: 
    push: 
        branches: [ "master" ]

jobs:
    build: 
        runs-on: ubuntu-latest
        steps:
            - name: Checkout deploy
              uses: actions/checkout@v4

            - name: Configure pages
              uses: actions/configure-pages@v5

            - name: Upload pages
              uses: actions/upload-pages-artifact@v3
              with: 
                path: '.'
    lint: 
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: install node
              uses: actions/setup-node@v4
              with:
                node-version: 22
            
            - name: start linter
              run: npx htmlhint index.html

    deploy:
        needs: [build, lint]
        runs-on: ubuntu-latest
        environment: 
            name: github-pages
        steps:
            - name: Deploy
              uses: actions/deploy-pages@v5
        


permissions: 
    contents: read
    pages: write
    id-token: write